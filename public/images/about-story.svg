<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" fill="none">
  <rect width="1000" height="650" fill="#F5F2E9"/>
  <!-- Decorative Background pattern -->
  <circle cx="500" cy="325" r="280" fill="#E8F5E9" opacity="0.5"/>
  <circle cx="500" cy="325" r="210" fill="#FFFFFF" opacity="0.7"/>
  
  <g transform="translate(500, 270)" text-anchor="middle">
    <rect x="-60" y="-60" width="120" height="120" rx="20" fill="#073B17"/>
    <!-- Hands & Heart Symbol -->
    <path d="M-25 15 C-25 -5 -5 -15 0 0 C5 -15 25 -5 25 15 C25 35 0 50 0 50 C0 50 -25 35 -25 15 Z" fill="#86efac" transform="scale(0.7) translate(0, -10)"/>
    <!-- Cross on top -->
    <path d="M0 -35 V-10 M-12 -22 H12" stroke="#F5F2E9" stroke-width="4" stroke-linecap="round"/>
    
    <text y="105" font-family="'Lora', Georgia, serif" font-size="24" font-weight="700" fill="#073B17">
      Our Journey of Faith and Service
    </text>
    <text y="135" font-family="'Lato', sans-serif" font-size="15" fill="#5C665F">
      Connecting hearts in Canada with communities in Ghana since 2022
    </text>
  </g>
</svg>
