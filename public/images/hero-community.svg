<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073B17"/>
      <stop offset="50%" stop-color="#0B4D20"/>
      <stop offset="100%" stop-color="#078A12"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F5F2E9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#073B17" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#heroGrad)"/>
  <rect width="1200" height="700" fill="url(#sunGlow)"/>
  
  <!-- Subtle geometric wave representing water of faith & community hills -->
  <path d="M0 550 Q 300 480 600 530 T 1200 510 L 1200 700 L 0 700 Z" fill="#073B17" opacity="0.6"/>
  <path d="M0 600 Q 400 540 800 590 T 1200 570 L 1200 700 L 0 700 Z" fill="#052710" opacity="0.8"/>
  
  <!-- Emblem Centerpiece -->
  <g transform="translate(600, 280)" text-anchor="middle">
    <circle cx="0" cy="0" r="100" fill="#F5F2E9" opacity="0.08" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="80" fill="#F5F2E9" opacity="0.12"/>
    <!-- Cross -->
    <path d="M0 -45 V45" stroke="#F5F2E9" stroke-width="8" stroke-linecap="round"/>
    <path d="M-28 -15 H28" stroke="#F5F2E9" stroke-width="8" stroke-linecap="round"/>
    <!-- Radiance Rays -->
    <path d="M-55 -40 L-40 -30 M55 -40 L40 -30 M-60 0 L-42 0 M60 0 L42 0 M-55 40 L-40 30 M55 40 L40 30" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>
    
    <text y="140" font-family="'Lora', Georgia, serif" font-size="28" font-weight="700" fill="#FFFFFF">
      FAITH FOUNTAIN FOUNDATION
    </text>
    <text y="175" font-family="'Lato', sans-serif" font-size="16" font-weight="400" fill="#F5F2E9" letter-spacing="2">
      Faith in action. Hope for every life.
    </text>
    <text y="210" font-family="'Lato', sans-serif" font-size="13" font-weight="500" fill="#86efac" letter-spacing="1">
      CANADA • GHANA • EST. 2022
    </text>
  </g>
</svg>
